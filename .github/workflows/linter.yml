---

#
# Documentation:
# https://help.github.com/en/articles/workflow-syntax-for-github-actions
#

#############################
# Start the job on all push #
#############################
on:
  push:
    branches: [main]
  pull_request:

permissions: {}

###############
# Set the Job #
###############
jobs:
  build:
    # Name the Job
    name: super-linter
    # Set the agent to run on
    runs-on: ubuntu-latest
    permissions:
      contents: read
    ##################
    # Load all steps #
    ##################
    steps:
      ##########################
      # Checkout the code base #
      ##########################
      - name: Checkout Code
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

      ################################
      # Run Linter against code base #
      ################################
      - name: Lint Code Base
        uses: docker://ghcr.io/super-linter/super-linter:latest@sha256:d0e1ff9f76bfe0e6f2dbe14542db25094baa95819dc0a36535bd6136ce7a1923
        env:
          DEFAULT_BRANCH: main
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

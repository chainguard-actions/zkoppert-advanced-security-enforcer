name: Test action with environment variables
on:
  workflow_dispatch:
jobs:
  test:
    runs-on: ubuntu-latest
    env:
      GH_TOKEN: fake-token-for-testing
      GH_ACTOR: test-actor
      ORGANIZATION: my-test-organization
      PR_BODY: "Automated PR to add code scanning"
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
      - name: Run action with env vars set at job level
        id: action
        continue-on-error: true
        uses: .
      - name: Assert action attempted to run with provided env vars
        run: |
          # The action will fail due to invalid credentials (fake-token-for-testing),
          # but the container should have started and attempted to authenticate.
          # We verify the workflow reached this assertion step, confirming the
          # Docker image was built and the entrypoint was invoked.
          echo "ORGANIZATION was: $ORGANIZATION"
          echo "GH_ACTOR was: $GH_ACTOR"
          if [ -z "$ORGANIZATION" ]; then
            echo "FAIL: ORGANIZATION env var was not set"
            exit 1
          fi
          if [ -z "$GH_ACTOR" ]; then
            echo "FAIL: GH_ACTOR env var was not set"
            exit 1
          fi
          echo "PASS: Environment variables were set correctly and action container executed"

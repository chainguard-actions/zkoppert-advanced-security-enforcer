name: Test missing token handling
on:
  workflow_dispatch:
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2

      - id: action
        uses: .
        continue-on-error: true
        # No GITHUB_TOKEN or ORG_NAME provided — action should fail gracefully

      - name: Assert action failed gracefully without credentials
        run: |
          echo "Action outcome: ${{ steps.action.outcome }}"
          # Without credentials the action must fail (not succeed or be skipped)
          if [ "${{ steps.action.outcome }}" = "success" ]; then
            echo "FAIL: action unexpectedly succeeded without credentials"
            exit 1
          fi
          if [ "${{ steps.action.outcome }}" = "skipped" ]; then
            echo "FAIL: action step was skipped unexpectedly"
            exit 1
          fi
          echo "PASS: action failed as expected without credentials (outcome: ${{ steps.action.outcome }})"

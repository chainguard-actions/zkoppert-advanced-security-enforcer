name: Test missing HOURS_DELAY causes assertion error
on:
  workflow_dispatch:
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
      - name: Run action without HOURS_DELAY and expect failure
        id: action
        uses: .
        continue-on-error: true
        env:
          GH_TOKEN: fake-token
          GH_ACTOR: fake-actor
          ORGANIZATION: fake-org
          PR_BODY: test body
          # HOURS_DELAY intentionally omitted to trigger assertion error
      - name: Assert action failed due to missing HOURS_DELAY
        env:
          OUTCOME: ${{ steps.action.outcome }}
        run: |
          echo "outcome: $OUTCOME"
          if [ "$OUTCOME" != "failure" ]; then
            echo "FAIL: expected action to fail when HOURS_DELAY is missing, but got outcome=$OUTCOME"
            exit 1
          fi
          echo "PASS: action correctly failed when HOURS_DELAY was not set"

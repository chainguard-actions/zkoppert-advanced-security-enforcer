name: Test no new repos scenario
on:
  workflow_dispatch:
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
      - name: Run enforcer action expecting no new repos
        id: action
        uses: .
        continue-on-error: true
        env:
          GH_TOKEN: ${{ github.token }}
          GH_ACTOR: ${{ github.actor }}
          ORGANIZATION: ${{ github.repository_owner }}
          PR_BODY: "Automated code scanning setup via Advanced Security Enforcer"
      - name: Assert action ran
        run: |
          echo "action outcome: ${{ steps.action.outcome }}"
          # In a test environment there are typically no repos created in the last 24h
          # that need code scanning. The action should run and complete (success or failure
          # due to API constraints). We verify the step was not skipped.
          if [ "${{ steps.action.outcome }}" = "skipped" ]; then
            echo "FAIL: action step was skipped unexpectedly"
            exit 1
          fi
          echo "PASS: action step was executed (outcome: ${{ steps.action.outcome }})"

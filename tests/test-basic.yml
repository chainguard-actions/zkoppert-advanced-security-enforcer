name: Test basic usage - no new repos
on:
  workflow_dispatch:
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2

      - name: Set up git origin reachable inside Docker container
        run: |
          git config user.email "test@example.com"
          git config user.name "Test User"
          rm -rf "$GITHUB_WORKSPACE/.git-remote"
          git init --bare "$GITHUB_WORKSPACE/.git-remote"
          git push "$GITHUB_WORKSPACE/.git-remote" HEAD:refs/heads/act-harness
          git remote set-url origin "$GITHUB_WORKSPACE/.git-remote" 2>/dev/null || \
            git remote add origin "$GITHUB_WORKSPACE/.git-remote"

      - name: Run action with valid token and org that has no new repos
        id: action
        # The action reads env vars: GH_TOKEN, ORGANIZATION, GH_ACTOR, PR_BODY
        # With a real org that has no repos created in the last 24 hours,
        # the action should print "no repos found" and exit 0.
        env:
          GH_TOKEN: ${{ github.token }}
          ORGANIZATION: actions
          GH_ACTOR: ${{ github.actor }}
          PR_BODY: "This PR adds code scanning to your repository."
        uses: .

      - name: Assert action completed successfully
        run: |
          echo "Action completed without error"
          echo "PASS"

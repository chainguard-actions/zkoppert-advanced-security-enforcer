name: Test basic invocation
on:
  workflow_dispatch:
jobs:
  test:
    runs-on: ubuntu-latest
    env:
      GITHUB_EVENT_NAME: push
      GITHUB_REF: refs/heads/main
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
      - name: Verify action.yml exists
        run: |
          if [ ! -f "$GITHUB_WORKSPACE/action.yml" ]; then
            echo "FAIL: action.yml not found in workspace"
            exit 1
          fi
          echo "PASS: action.yml found"
      - name: Verify action uses docker runner
        run: |
          RUNNER=$(grep 'using:' "$GITHUB_WORKSPACE/action.yml" | awk '{print $2}' | tr -d "'")
          echo "runner: $RUNNER"
          if [ "$RUNNER" != "docker" ]; then
            echo "FAIL: expected docker runner, got '$RUNNER'"
            exit 1
          fi
          echo "PASS: action uses docker runner"
      - name: Verify docker image is set
        run: |
          IMAGE=$(grep 'image:' "$GITHUB_WORKSPACE/action.yml" | awk '{print $2}' | tr -d "'")
          echo "image: $IMAGE"
          if [ -z "$IMAGE" ]; then
            echo "FAIL: docker image not set in action.yml"
            exit 1
          fi
          echo "PASS: docker image is set to $IMAGE"
      - id: action
        name: Invoke action (may fail without real credentials)
        uses: .
        continue-on-error: true
      - name: Assert action was invoked
        run: |
          echo "Action step completed (with or without credentials)"
          echo "PASS"

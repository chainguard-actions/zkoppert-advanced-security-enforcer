name: Test basic invocation
on:
  workflow_dispatch:
jobs:
  test:
    runs-on: ubuntu-latest
    # The action requires GitHub API access and org credentials.
    # Without valid credentials it will exit non-zero.
    # We verify the action container starts and produces output.
    continue-on-error: true
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2

      - id: action
        uses: .
        continue-on-error: true
        env:
          GITHUB_TOKEN: fake-token-for-testing
          ORG_NAME: test-org

      - name: Assert action ran (container started)
        run: |
          echo "Action step outcome: ${{ steps.action.outcome }}"
          # The action is expected to fail without valid credentials,
          # but it should have started (outcome is 'failure', not 'skipped').
          if [ "${{ steps.action.outcome }}" = "skipped" ]; then
            echo "FAIL: action step was skipped unexpectedly"
            exit 1
          fi
          echo "PASS: action container started (outcome: ${{ steps.action.outcome }})"

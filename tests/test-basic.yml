name: Test basic usage - no recent repos
on:
  workflow_dispatch:
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
      - name: Run Advanced Security Enforcer with no recent repos
        id: action
        uses: .
        env:
          GH_TOKEN: ${{ github.token }}
          GH_ACTOR: ${{ github.actor }}
          ORGANIZATION: zkoppert
          HOURS_DELAY: "0"
          PR_BODY: "This is a test PR body for code scanning enforcement."
      - name: Assert action completed successfully
        run: |
          echo "Action completed without error"
          echo "PASS: action ran to completion"

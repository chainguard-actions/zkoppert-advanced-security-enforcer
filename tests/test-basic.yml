name: Test basic usage - action runs and exits cleanly
on:
  workflow_dispatch:
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
      - name: Run enforcer action with real org
        id: action
        uses: .
        continue-on-error: true
        env:
          GH_TOKEN: ${{ github.token }}
          GH_ACTOR: ${{ github.actor }}
          ORGANIZATION: ${{ github.repository_owner }}
          PR_BODY: "Automated code scanning setup via Advanced Security Enforcer"
      - name: Assert action ran (step was executed)
        run: |
          echo "action outcome: ${{ steps.action.outcome }}"
          # The action makes real GitHub API calls and may exit non-zero if no repos
          # are found or if API errors occur. We verify the step was executed.
          if [ "${{ steps.action.outcome }}" = "skipped" ]; then
            echo "FAIL: action step was skipped unexpectedly"
            exit 1
          fi
          echo "PASS: action step was executed (outcome: ${{ steps.action.outcome }})"
